
# Workflow de Integração Contínua focado em execução de testes unitários
# Estrutura preparada para expansão futura (novos jobs, stages, etc)

name: Continuous Deployment

on:
  push:
    branches:
      - main

env:
  # Versão do Node utilizada em todo o workflow
  NODE_VERSION: '24'
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_SCOPE: wanddes
  # Refs dos projetos Supabase (não são secretos), usados nas travas de ambiente
  SUPABASE_PREVIEW_PROJECT_ID: ${{ vars.SUPABASE_PREVIEW_PROJECT_ID }}
  SUPABASE_PROD_PROJECT_ID: ${{ vars.SUPABASE_PROD_PROJECT_ID }}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Faz checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # 2. Configura o ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install dependencies
        run: yarn install

      # 5. Executa os testes unitários com Vitest
      - name: Run unit tests
        run: yarn test

  build-and-deploy:
    name: Build & Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      # 1. Faz checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # 2. Configura o ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install dependencies
        run: yarn install

      # 5. Obter as configurações do vercel
      - name: Pull Vercel Config
        run: yarn vercel pull --yes --environment=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE

      # 6. Build para o Vercel
      - name: Build Vercel
        run: yarn vercel build --token=$VERCEL_TOKEN

      # 7. Garante que o build de preview aponta para o Supabase Preview
      - name: Verify Supabase target (preview)
        run: node scripts/check-supabase-target.mjs --dir .vercel/output --expect "$SUPABASE_PREVIEW_PROJECT_ID" --forbid "$SUPABASE_PROD_PROJECT_ID"

      # 8. Deploy preview no vercel
      - name: Deploy preview
        id: deploy
        run: |
          URL=$(yarn --silent vercel deploy --prebuilt --target=preview --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE)
          echo "deployment-url=$URL" >> $GITHUB_OUTPUT

  e2e-tests:
    name: Run E2E Tests
    needs: [build-and-deploy]
    # Playwright 1.58 não suporta o Ubuntu 26.04 (ubuntu-latest atual)
    runs-on: ubuntu-24.04

    steps:
      # 1. Faz checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # 2. Configura o ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install dependencies
        run: yarn install

      # 5. Instalação do Chromium
      - name: Install Plawright Browser
        run: yarn playwright install --with-deps chromium

      # 6. Execução dos Testes de Regressão
      - name: Run E2E Regression Tests
        run: yarn playwright test
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.deployment-url }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          TESTDINO_TOKEN: ${{ secrets.TD_TOKEN }}

      # 7. Relatório de Testes Automatizados
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report

  # Substitui o "vercel promote": as variáveis VITE_* ficam gravadas no build, então
  # produção precisa de um build próprio, feito com as variáveis do ambiente Production
  # da Vercel (Supabase Production). Roda só se os testes E2E da prévia passarem.
  deploy-production:
    name: Build & Deploy Vercel Production
    needs: [e2e-tests]
    runs-on: ubuntu-latest

    steps:
      # 1. Faz checkout do código do repositório
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # 2. Configura o ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3. Habilita o Corepack para gerenciamento do Yarn
      - name: Enable Corepack
        run: corepack enable

      # 4. Instala as dependências do projeto
      - name: Install dependencies
        run: yarn install

      # 5. Obter as configurações de produção do vercel
      - name: Pull Vercel Config (production)
        run: yarn vercel pull --yes --environment=production --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE

      # 6. Build de produção
      - name: Build Vercel (production)
        run: yarn vercel build --prod --token=$VERCEL_TOKEN

      # 7. Garante que o build de produção aponta para o Supabase Production
      - name: Verify Supabase target (production)
        run: node scripts/check-supabase-target.mjs --dir .vercel/output --expect "$SUPABASE_PROD_PROJECT_ID" --forbid "$SUPABASE_PREVIEW_PROJECT_ID"

      # 8. Deploy em produção
      - name: Deploy production
        run: yarn --silent vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN --scope=$VERCEL_SCOPE
